name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python tests (reader, server, face packs)
        run: python -m unittest discover -s tests -v
      - name: Web tests (role ratings, similar players, best XI)
        run: node --test tests/web.test.js
      - name: Syntax check (web)
        run: |
          node --check web/app.js
          node --check web/tools.js
          node --check web/roles.js
          node --check web/i18n.js
